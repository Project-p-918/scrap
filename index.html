<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찢어 붙이기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--mat:#3d7a62;--ink:#1f2a26;--hot:#e2574c}
*{box-sizing:border-box}
body{margin:0;padding:20px 14px 40px;font:15px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background-color:var(--mat);background-image:linear-gradient(#ffffff2e 1px,transparent 1px),linear-gradient(90deg,#ffffff2e 1px,transparent 1px);background-size:32px 32px}
h1{font:400 34px/1.1 Jua,system-ui,sans-serif;color:#fff;margin:0 0 4px}
.sub{color:#ffffffcc;margin:0 0 18px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.col{display:grid;gap:16px;align-content:start}
.sheet{background:#fff;padding:16px;box-shadow:0 2px 0 #0002,0 10px 24px #0004;border-radius:2px}
.sheet h2{font:400 20px Jua,system-ui,sans-serif;margin:0 0 10px}
label.row,.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row span{min-width:52px}
input[type=range]{flex:1;accent-color:var(--hot)}
.btn{font:inherit;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:9px 14px;border-radius:4px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.main{background:var(--hot);border-color:var(--hot);color:#fff;font:400 20px Jua,system-ui,sans-serif;width:100%;padding:12px}
.pick{display:block;border:2px dashed #8a9a93;padding:18px;text-align:center;cursor:pointer;border-radius:4px}
.pick img{max-width:100%;max-height:200px;display:block;margin:0 auto 8px}
.pick input{display:none}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #0003;cursor:pointer}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:22px;margin:8px 0 0;color:#555}
#msg.err{color:#b3261e}
.checker{background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px;text-align:center;padding:10px}
.checker img{max-width:100%;max-height:260px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#stage{width:100%;display:block;touch-action:none;background:#f4d35e;box-shadow:0 0 0 1px #0002}
select{font:inherit;padding:6px}
.hint{font-size:13px;color:#667;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap" style="margin-bottom:6px;display:block"><h1>찢어 붙이기</h1><p class="sub">사진을 넣으면 인물만 종이처럼 찢어서 스크랩으로 만들어요.</p></div>
<div class="wrap">
  <div class="col">
    <section class="sheet">
      <h2>사진 넣기</h2>
      <label class="pick" id="pick"><div id="pickTxt">눌러서 사진 고르기</div><input type="file" id="file" accept="image/*"></label>
      <div class="row"><span>여백</span><input type="range" id="margin" min="10" max="80" value="34"></div>
      <div class="row"><span>거칠기</span><input type="range" id="rough" min="20" max="100" value="65"></div>
      <div class="row"><span>종이색</span><div class="sw" id="sw"></div></div>
      <button class="btn main" id="go" disabled>찢기</button>
      <p id="msg"></p>
      <p class="hint">처음 한 번은 AI 모델을 내려받느라 몇 초 걸려요. 사진은 서버로 올라가지 않아요.</p>
    </section>
    <section class="sheet" id="resSheet" hidden>
      <h2>찢은 조각</h2>
      <div class="checker"><img id="prev" alt="찢은 조각"></div>
      <div class="btns"><button class="btn" id="saveScrap">투명 PNG 저장</button></div>
    </section>
  </div>
  <section class="sheet">
    <h2>스크랩북</h2>
    <canvas id="stage"></canvas>
    <p class="hint">조각을 끌어서 옮기고, 아래 슬라이더로 크기와 회전을 바꿔요.</p>
    <div class="row"><span>크기</span><input type="range" id="size" min="10" max="300" value="100"></div>
    <div class="row"><span>회전</span><input type="range" id="rot" min="-180" max="180" value="0"></div>
    <div class="row"><span>배경색</span><input type="color" id="bgc" value="#f4d35e">
      <label class="btn" style="margin-left:auto">배경 이미지<input type="file" id="bgf" accept="image/*" hidden></label>
      <button class="btn" id="bgx">지우기</button></div>
    <div class="row"><span>비율</span><select id="ratio"><option value="1">1:1</option><option value="1.25" selected>4:5</option><option value="1.7778">9:16</option></select>
      <button class="btn" id="del" style="margin-left:auto">선택한 조각 삭제</button></div>
    <div class="btns"><button class="btn main" id="saveAll" disabled>합성 이미지 PNG 저장</button></div>
  </section>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const LIB="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
let lib,file=null,scrapCanvas=null,items=[],sel=-1,bgImg=null,paper="#ffffff";

/* ---------- 종이 찢는 소리 ---------- */
let ac;
function tear(dur=1.3,vol=.6){
  ac??=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume();
  const n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  let env=0;
  for(let i=0;i<n;i++){
    const t=i/n;
    if(Math.random()<.0015+.002*Math.sin(t*Math.PI))env=1;
    env*=.9985;
    const rip=.25+.75*Math.pow(Math.sin(Math.PI*t),.6);
    d[i]=(Math.random()*2-1)*(.25*rip+env*.9*rip)*Math.min(1,t*30)*Math.min(1,(1-t)*12);
  }
  const src=ac.createBufferSource();src.buffer=buf;
  const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=900;
  const bp=ac.createBiquadFilter();bp.type="bandpass";bp.Q.value=.7;
  bp.frequency.setValueAtTime(2500,ac.currentTime);bp.frequency.linearRampToValueAtTime(5200,ac.currentTime+dur);
  const g=ac.createGain();g.gain.value=vol;
  src.connect(hp).connect(bp).connect(g).connect(ac.destination);src.start();
}

/* ---------- 찢은 가장자리 만들기 ---------- */
function vnoise(w,h,cell,seed){
  const gw=Math.ceil(w/cell)+2,gh=Math.ceil(h/cell)+2,g=new Float32Array(gw*gh);
  let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<g.length;i++)g[i]=r();
  const o=new Float32Array(w*h);
  for(let y=0;y<h;y++){
    const fy=y/cell,y0=fy|0,ty=fy-y0,sy=ty*ty*(3-2*ty);
    for(let x=0;x<w;x++){
      const fx=x/cell,x0=fx|0,tx=fx-x0,sx=tx*tx*(3-2*tx);
      const a=g[y0*gw+x0],b=g[y0*gw+x0+1],c=g[(y0+1)*gw+x0],d=g[(y0+1)*gw+x0+1];
      o[y*w+x]=(a+(b-a)*sx)*(1-sy)+(c+(d-c)*sx)*sy;
    }
  }
  return o;
}
function fbm(w,h,seed){
  const a=vnoise(w,h,22,seed),b=vnoise(w,h,7,seed+1),c=vnoise(w,h,2.5,seed+2);
  for(let i=0;i<a.length;i++)a[i]=a[i]*.55+b[i]*.3+c[i]*.15;
  return a;
}
function blur(a,w,h,r){
  const t=new Float32Array(a.length),k=2*r+1,cl=(v,m)=>Math.min(m,Math.max(0,v));
  for(let p=0;p<2;p++){
    for(let y=0;y<h;y++){
      let s=0;const o=y*w;
      for(let x=-r;x<=r;x++)s+=a[o+cl(x,w-1)];
      for(let x=0;x<w;x++){t[o+x]=s/k;s+=a[o+cl(x+r+1,w-1)]-a[o+cl(x-r,w-1)];}
    }
    for(let x=0;x<w;x++){
      let s=0;
      for(let y=-r;y<=r;y++)s+=t[cl(y,h-1)*w+x];
      for(let y=0;y<h;y++){a[y*w+x]=s/k;s+=t[cl(y+r+1,h-1)*w+x]-t[cl(y-r,h-1)*w+x];}
    }
  }
}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

function makeScrap(img,{margin,rough,color}){
  const P=margin+30,W=img.width+2*P,H=img.height+2*P;
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d",{willReadFrequently:true});
  for(const rr of [margin,margin*.6,margin*.3])
    for(let k=0;k<28;k++){const a=k/28*Math.PI*2;x.drawImage(img,P+Math.cos(a)*rr,P+Math.sin(a)*rr);}
  x.drawImage(img,P,P);
  const src=x.getImageData(0,0,W,H).data,al=new Float32Array(W*H);
  for(let i=0;i<al.length;i++)al[i]=src[i*4+3]>40?1:0;
  blur(al,W,H,10);
  const n1=fbm(W,H,1234),n2=fbm(W,H,98765),k=2.2*rough;
  const out=x.createImageData(W,H),o=out.data,[cr,cg,cb]=hex(color);
  let bx0=W,by0=H,bx1=0,by1=0;
  for(let i=0;i<al.length;i++){
    const v=al[i];
    if(v<.01)continue;
    const w4=4*v*(1-v);
    const m1=v+(n1[i]-.5)*k*w4>.5,m2=v+(n2[i]-.5)*k*w4>.36;
    if(!m1&&!m2)continue;
    const g=(Math.random()-.5)*10,j=i*4;
    if(m1){o[j]=cr+g;o[j+1]=cg+g;o[j+2]=cb+g;}
    else{const f=.7,t=.9+n2[i]*.12;
      o[j]=(cr+(246-cr)*f)*t+g;o[j+1]=(cg+(244-cg)*f)*t+g;o[j+2]=(cb+(238-cb)*f)*t+g;}
    o[j+3]=255;
    const px=i%W,py=(i/W)|0;
    if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;
  }
  x.clearRect(0,0,W,H);x.putImageData(out,0,0);x.drawImage(img,P,P);
  const pad=4,cw=bx1-bx0+1+pad*2,ch=by1-by0+1+pad*2;
  const r=document.createElement("canvas");r.width=cw;r.height=ch;
  r.getContext("2d").drawImage(c,bx0-pad,by0-pad,cw,ch,0,0,cw,ch);
  return r;
}

/* ---------- 입력/제거 ---------- */
async function shrink(f,max=900){
  const bm=await createImageBitmap(f),s=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
const msg=(t,err)=>{$("#msg").textContent=t;$("#msg").className=err?"err":"";};

$("#file").onchange=e=>{
  file=e.target.files[0];if(!file)return;
  const u=URL.createObjectURL(file);
  $("#pick").innerHTML=`<img src="${u}" alt=""><div>다른 사진 고르기</div><input type="file" id="file2" accept="image/*">`;
  $("#file2").onchange=ev=>{$("#file").files=ev.target.files;$("#file").onchange({target:ev.target});};
  $("#go").disabled=false;msg("");
};

$("#go").onclick=async()=>{
  if(!file)return;
  $("#go").disabled=true;tear(1.3,.6);msg("준비 중…");
  try{
    lib??=await import(LIB);
    const small=await shrink(file);
    const blob=await lib.removeBackground(small,{
      output:{format:"image/png"},
      progress:(key,cur,tot)=>msg(key.startsWith("fetch")?`모델 내려받는 중 ${Math.round(cur/tot*100)}%`:"인물을 찾는 중…")
    });
    msg("종이 가장자리를 찢는 중…");
    await new Promise(r=>setTimeout(r,30));
    const img=await createImageBitmap(blob);
    scrapCanvas=makeScrap(img,{margin:+$("#margin").value,rough:+$("#rough").value/100,color:paper});
    tear(.7,.5);
    $("#prev").src=scrapCanvas.toDataURL("image/png");$("#resSheet").hidden=false;
    addItem(scrapCanvas);msg("완성! 스크랩북에 붙였어요.");
  }catch(err){console.error(err);msg("실패했어요: "+(err.message||err)+" (인터넷 연결과 호스팅 환경을 확인해주세요)",true);}
  $("#go").disabled=false;
};

/* ---------- 종이색 ---------- */
[["#ffffff"],["#d9b98a"],["#f6b8c4"],["#b9e2cf"],["#b7d4f2"]].forEach(([c],i)=>{
  const b=document.createElement("button");b.style.background=c;b.title=c;b.className=i?"":"on";
  b.onclick=()=>{paper=c;document.querySelectorAll("#sw button").forEach(x=>x.classList.remove("on"));b.classList.add("on");};
  $("#sw").append(b);
});

/* ---------- 저장 ---------- */
function download(canvas,name){
  canvas.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();},"image/png");
}
$("#saveScrap").onclick=()=>scrapCanvas&&download(scrapCanvas,"scrap.png");
$("#saveAll").onclick=()=>{render(true);download(st,"scrapbook.png");render();};

/* ---------- 스크랩북 ---------- */
const st=$("#stage"),sx=st.getContext("2d");let bgColor="#f4d35e";
function setRatio(){st.width=1080;st.height=Math.round(1080*+$("#ratio").value);render();}
function render(exp){
  const W=st.width,H=st.height;
  sx.fillStyle=bgColor;sx.fillRect(0,0,W,H);
  if(bgImg){const s=Math.max(W/bgImg.width,H/bgImg.height),w=bgImg.width*s,h=bgImg.height*s;sx.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h);}
  items.forEach((it,i)=>{
    sx.save();sx.translate(it.x,it.y);sx.rotate(it.rot*Math.PI/180);sx.scale(it.s,it.s);
    sx.shadowColor="rgba(0,0,0,.35)";sx.shadowBlur=18;sx.shadowOffsetY=8;
    sx.drawImage(it.c,-it.c.width/2,-it.c.height/2);
    if(!exp&&i===sel){sx.shadowColor="transparent";sx.setLineDash([14,10]);sx.lineWidth=3/it.s;sx.strokeStyle="#e2574c";sx.strokeRect(-it.c.width/2,-it.c.height/2,it.c.width,it.c.height);}
    sx.restore();
  });
  $("#saveAll").disabled=!items.length;
}
function addItem(c){
  items.push({c,x:st.width/2,y:st.height/2,s:Math.min(1,st.width*.55/c.width,st.height*.6/c.height),rot:(Math.random()-.5)*8});
  select(items.length-1);
}
function select(i){
  sel=i;
  if(i>=0){$("#size").value=Math.round(items[i].s*100);$("#rot").value=Math.round(items[i].rot);}
  render();
}
$("#size").oninput=e=>{if(sel>=0){items[sel].s=e.target.value/100;render();}};
$("#rot").oninput=e=>{if(sel>=0){items[sel].rot=+e.target.value;render();}};
$("#del").onclick=()=>{if(sel>=0){items.splice(sel,1);select(items.length-1);}};
$("#bgc").oninput=e=>{bgColor=e.target.value;render();};
$("#bgx").onclick=()=>{bgImg=null;render();};
$("#bgf").onchange=async e=>{const f=e.target.files[0];if(f){bgImg=await createImageBitmap(f);render();}};
$("#ratio").onchange=setRatio;

function pos(e){const r=st.getBoundingClientRect();return[(e.clientX-r.left)*st.width/r.width,(e.clientY-r.top)*st.height/r.height];}
function hit(it,px,py){
  const a=-it.rot*Math.PI/180,dx=px-it.x,dy=py-it.y;
  const lx=(dx*Math.cos(a)-dy*Math.sin(a))/it.s,ly=(dx*Math.sin(a)+dy*Math.cos(a))/it.s;
  return Math.abs(lx)<=it.c.width/2&&Math.abs(ly)<=it.c.height/2;
}
let drag=null;
st.onpointerdown=e=>{
  const [px,py]=pos(e);
  for(let i=items.length-1;i>=0;i--)if(hit(items[i],px,py)){
    const it=items.splice(i,1)[0];items.push(it);
    drag={dx:it.x-px,dy:it.y-py};select(items.length-1);st.setPointerCapture(e.pointerId);return;
  }
  select(-1);
};
st.onpointermove=e=>{
  if(!drag||sel<0)return;
  const [px,py]=pos(e);items[sel].x=px+drag.dx;items[sel].y=py+drag.dy;render();
};
st.onpointerup=st.onpointercancel=()=>{drag=null;};
setRatio();
</script>
</body>
</html>
